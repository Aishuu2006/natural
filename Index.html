<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natural Powders</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #f5f5f0; color: #333; }

  header {
    background: #2e7d32;
    color: white;
    text-align: center;
    padding: 20px;
  }
  header h1 { font-size: 28px; }
  header p { font-size: 14px; margin-top: 5px; }

  .products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 20px;
    max-width: 1000px;
    margin: auto;
  }

  .card {
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    overflow: hidden;
    text-align: center;
    padding-bottom: 15px;
    transition: 0.3s;
  }
  .card:hover { transform: translateY(-5px); box-shadow: 0 6px 15px rgba(0,0,0,0.2); }

  .card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
  }

  .card h3 { margin: 12px 0 5px; color: #2e7d32; }
  .card .price { font-size: 18px; font-weight: bold; color: #d32f2f; margin: 5px 0; }
  .card .weight { font-size: 14px; color: #777; margin-bottom: 10px; }

  .btn {
    background: #2e7d32;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.3s;
  }
  .btn:hover { background: #1b5e20; }

  footer {
    background: #2e7d32;
    color: white;
    text-align: center;
    padding: 15px;
    margin-top: 20px;
  }
  footer a { color: #fff; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>

<header>
  <h1>🌿 Natural Powders</h1>
  <p>100% Pure & Natural | 100g - ₹99</p>
</header>

<div class="products">

  <div class="card">
    <img src="images/abc.jpg" alt="ABC Powder">
    <h3>ABC Powder</h3>
    <p class="weight">100 grams</p>
    <p class="price">₹99</p>
    <button class="btn" onclick="order('ABC Powder')">Order Now</button>
  </div>

  <div class="card">
    <img src="images/beetroot.jpg" alt="Beetroot Powder">
    <h3>Beetroot Powder</h3>
    <p class="weight">100 grams</p>
    <p class="price">₹99</p>
    <button class="btn" onclick="order('Beetroot Powder')">Order Now</button>
  </div>

  <div class="card">
    <img src="images/carrot.jpg" alt="Carrot Powder">
    <h3>Carrot Powder</h3>
    <p class="weight">100 grams</p>
    <p class="price">₹99</p>
    <button class="btn" onclick="order('Carrot Powder')">Order Now</button>
  </div>

  <div class="card">
    <img src="images/nelli.jpg" alt="Nelli Powder">
    <h3>Nelli Powder</h3>
    <p class="weight">100 grams</p>
    <p class="price">₹99</p>
    <button class="btn" onclick="order('Nelli Powder')">Order Now</button>
  </div>

</div>

<footer>
  <p>📞 Order on WhatsApp: <a href="https://wa.me/919008913495">9008913495</a></p>
  <p style="font-size:12px;margin-top:8px;">© 2025 Natural Powders</p>
</footer>

<script>
function order(product) {
  const phone = "919008913495";
  const msg = encodeURIComponent("Namaskara! Nanage " + product + " (100g - ₹99) order madbeku.");
  window.open("https://wa.me/" + phone + "?text=" + msg, "_blank");
}
</script>

</body>
</html>
